<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fbfbfd" />
    <title>LAXDB — Lacrosse player database</title>
    <meta name="description" content="Every lacrosse player, one profile. Season-by-season stats, game logs, All-America honors and career history for college, pro and box lacrosse." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%230071e3'/%3E%3Ctext x='50' y='68' font-size='52' font-family='-apple-system,system-ui' font-weight='700' fill='white' text-anchor='middle'%3EL%3C/text%3E%3C/svg%3E" />

    <!-- Site-level card. Entity pages (/player, /team, /league) are answered by
         netlify/functions/meta.ts, which replaces the title, description, canonical,
         og/twitter tags and JSON-LD with that entity's own. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LAXDB" />
    <meta property="og:title" content="LAXDB — Lacrosse player database" />
    <meta property="og:description" content="Every lacrosse player, one profile. 21,000+ players across the NCAA, MCLA, PLL, NLL and Canadian box lacrosse." />
    <meta property="og:url" content="https://laxdb.netlify.app/" />
    <meta property="og:image" content="https://laxdb.netlify.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LAXDB — Lacrosse player database" />
    <meta name="twitter:description" content="Every lacrosse player, one profile. Season stats, game logs and career history." />
    <meta name="twitter:image" content="https://laxdb.netlify.app/og.png" />
    <meta name="robots" content="index,follow,max-image-preview:large" />
  </head>
  <body>
    <div id="root"></div>
    <!-- The landing page's slice, baked at build time by scripts/bake-home-seed.mjs. Meta.ts removes
         this block before an entity page is served, so a player page does not carry it. -->
    <!--seed:start--><!--seed:end-->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
