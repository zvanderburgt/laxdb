[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Hash routing: every route is served from / , so no SPA rewrite rules are needed.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/players/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# dataset is refreshed by the importer, so keep it revalidated
[[headers]]
  for = "/data.json"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"
