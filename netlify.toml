[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Hash routing: every route is served from / , so no SPA rewrite rules are needed.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/players/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# dataset is refreshed by the importer, so keep it revalidated
[[headers]]
  for = "/data.json"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

# The admin API. Files here are already bundled by scripts/build-functions.mjs, so Netlify must not
# bundle them again; the function exports `config.path = "/api/*"` for its own routing.
[functions]
  directory = "netlify/functions-build"
  node_bundler = "none"

# the published override document is a deploy-time snapshot as well, so the site still applies
# editorial work if the function is unreachable
[[headers]]
  for = "/overrides.json"
  [headers.values]
    Cache-Control = "public, max-age=60, must-revalidate"
