[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Real paths, not hashes. These rules serve the app shell for the list pages and the
# navigational detail routes; /player/*, /team/* and /league/* are answered by
# netlify/functions/meta.ts, which returns the same shell with that entity's title,
# description, Open Graph card and JSON-LD in the head. A route added to App.tsx needs a
# rule here, or it falls through to the 404 page.
[[redirects]]
  from = "/players"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/teams"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/leagues"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/coaches"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/scores"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/leaders"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/history"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/origins"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/compare"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/my-roster"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/vs/*"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/game/*"
  to = "/index.html"
  status = 200

# Hash routing is gone, so every route is served from / or from the meta function.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/players/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# dataset is refreshed by the importer, so keep it revalidated
[[headers]]
  for = "/data.json"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

# The admin API. Files here are already bundled by scripts/build-functions.mjs, so Netlify must not
# bundle them again; the function exports `config.path = "/api/*"` for its own routing.
[functions]
  directory = "netlify/functions-build"
  node_bundler = "none"

# the published override document is a deploy-time snapshot as well, so the site still applies
# editorial work if the function is unreachable
[[headers]]
  for = "/overrides.json"
  [headers.values]
    Cache-Control = "public, max-age=60, must-revalidate"
